name: compick-presentation
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: compick
      POSTGRES_DB: compick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U compick -d compick]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: compick-presentation:latest
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/uploads
    environment:
      DATABASE_URL: postgresql://compick:${POSTGRES_PASSWORD}@db:5432/compick?schema=public
      TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      AUTH_URL: https://168.110.119.148
      UPLOAD_DIRECTORY: /app/storage/uploads
      ADMIN_ORIGIN: https://168.110.119.148
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  web:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
  tools:
    image: compick-presentation-tools:latest
    build:
      context: .
      target: builder
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://compick:${POSTGRES_PASSWORD}@db:5432/compick?schema=public
    command: [npm, run, prisma:deploy]
volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
